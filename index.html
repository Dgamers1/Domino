
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Velha Online</title>
<style>
:root {
  --bg:#080f1e; --panel:#111d32; --blue:#2878ff;
  --green:#20d99a; --text:#f4f7ff; --muted:#91a0b8;
  --line:#263650;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:22px;
  background:radial-gradient(circle at top,#172c4d,var(--bg) 65%);
  color:var(--text); font-family:Arial,sans-serif;
  display:flex; justify-content:center; align-items:center;
}
.app{width:100%;max-width:460px}
header{text-align:center;margin-bottom:24px}
.logo{
  display:inline-grid;place-items:center;width:64px;height:64px;
  border-radius:20px;background:#173b70;color:white;
  font-size:30px;font-weight:bold;margin-bottom:12px;
}
h1{font-size:27px;margin:0 0 7px}
.subtitle{color:var(--muted);font-size:14px}
.card{
  background:rgba(17,29,50,.96);border:1px solid var(--line);
  border-radius:20px;padding:20px;margin-bottom:15px;
  box-shadow:0 15px 40px #0003;
}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}
input{
  width:100%;padding:14px;border-radius:11px;
  border:1px solid var(--line);background:#091426;
  color:white;font-size:16px;outline:none;
}
input:focus{border-color:var(--blue)}
button{
  border:0;border-radius:11px;padding:14px 16px;
  font-weight:bold;font-size:15px;cursor:pointer;
  transition:.15s;
}
button:active{transform:scale(.98)}
.primary{background:var(--blue);color:white;width:100%;margin-top:14px}
.secondary{background:#1d304d;color:white;width:100%;margin-top:10px}
.green{background:var(--green);color:#05251b;width:100%;margin-top:12px}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px}
.row button{flex:1}
.hidden{display:none!important}
.status{
  text-align:center;color:var(--muted);font-size:14px;
  min-height:20px;margin:12px 0;
}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{
  background:#0a172b;border:1px solid var(--line);
  border-radius:13px;padding:13px;text-align:center;
}
.player.active{border-color:var(--green);background:#102b30}
.player .symbol{font-size:25px;font-weight:900}
.player small{color:var(--muted)}
.board{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:9px;margin:20px auto;max-width:340px;
}
.cell{
  aspect-ratio:1;background:#0a172b;border:1px solid #304361;
  border-radius:15px;color:white;font-size:clamp(42px,13vw,65px);
  font-weight:900;display:grid;place-items:center;padding:0;
}
.cell.x{color:#54a0ff}
.cell.o{color:var(--green)}
.cell.winner{background:#174538;border-color:var(--green)}
.room-code{
  text-align:center;background:#091426;border:1px dashed #41618b;
  border-radius:12px;padding:13px;font-size:23px;
  font-weight:bold;letter-spacing:5px;margin:12px 0;
}
.score{display:flex;justify-content:space-around;text-align:center}
.score strong{display:block;font-size:24px;margin-top:4px}
.score span{font-size:12px;color:var(--muted)}
.notice{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
footer{text-align:center;color:#667791;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="logo">X O</div>
  <h1>Jogo da Velha</h1>
  <div class="subtitle">Desafie alguém online em tempo real</div>
</header>

<section class="card" id="menu">
  <label>Seu nome</label>
  <input id="name" maxlength="16" placeholder="Digite seu nome">
  <button class="primary" id="createBtn">＋ Criar sala</button>
  <label>Entrar em uma sala existente</label>
  <input id="roomInput" maxlength="6" placeholder="Código da sala">
  <button class="secondary" id="joinBtn">Entrar na sala</button>
  <div class="status" id="menuStatus"></div>
</section>

<section class="card hidden" id="lobby">
  <div style="text-align:center">
    <div class="subtitle">CÓDIGO DA SALA</div>
    <div class="room-code" id="roomCode">------</div>
    <button class="secondary" id="copyBtn">Copiar código</button>
  </div>
  <div class="status" id="lobbyStatus">Aguardando outro jogador...</div>
  <div class="players" id="lobbyPlayers"></div>
  <button class="green hidden" id="startBtn">Começar partida</button>
  <button class="secondary" id="leaveLobby">Sair da sala</button>
</section>

<section class="card hidden" id="game">
  <div class="players">
    <div class="player" id="playerX">
      <div class="symbol" style="color:#54a0ff">X</div>
      <strong id="nameX">Jogador 1</strong><br>
      <small id="scoreX">0 vitórias</small>
    </div>
    <div class="player" id="playerO">
      <div class="symbol" style="color:#20d99a">O</div>
      <strong id="nameO">Jogador 2</strong><br>
      <small id="scoreO">0 vitórias</small>
    </div>
  </div>

  <div class="status" id="gameStatus">Aguardando...</div>
  <div class="board" id="board"></div>

  <div class="score">
    <div><span>EMPATES</span><strong id="draws">0</strong></div>
    <div><span>PARTIDAS</span><strong id="matches">0</strong></div>
  </div>
  <button class="green hidden" id="rematchBtn">Jogar novamente</button>
  <button class="secondary" id="backBtn">Sair da partida</button>
</section>
<footer>Jogo da Velha Online • Feito para jogar com amigos</footer>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD5KKnFBcBrtvddlHUyCsf5afe70c426Eo",
  authDomain: "domino-11119.firebaseapp.com",
  projectId: "domino-11119",
  storageBucket: "domino-11119.firebasestorage.app",
  messagingSenderId: "994443409702",
  appId: "1:994443409702:web:d82f9177af7ca6849f29e7",
  databaseURL: "https://domino-11119-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
let uid = null, roomId = null, roomRef = null, roomData = null;
let mySymbol = null, unsubscribe = null, busy = false;

const menu = $('menu'), lobby = $('lobby'), game = $('game');
const wins = {X:0,O:0};

function show(section){
  [menu,lobby,game].forEach(s=>s.classList.add('hidden'));
  section.classList.remove('hidden');
}
function cleanName(){
  return $('name').value.trim().slice(0,16) || 'Jogador';
}
function code(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}
function message(id,text){$(id).textContent=text}

auth.signInAnonymously().then(cred=>{
  uid=cred.user.uid;
}).catch(err=>{
  message('menuStatus','Erro de autenticação: '+err.message);
});

function waitAuth(){
  if(uid) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>reject(new Error('Autenticação demorou demais.')),10000);
    const unsub=auth.onAuthStateChanged(user=>{
      if(user){uid=user.uid;clearTimeout(timeout);unsub();resolve();}
    });
  });
}

async function createRoom(){
  try{
    await waitAuth();
    const id=code();
    const ref=db.ref('ticTacToe/'+id);
    const snap=await ref.get();
    if(snap.exists()) return createRoom();
    await ref.set({
      status:'lobby',
      host:uid,
      players:{
        X:{uid,name:cleanName()},
        O:null
      },
      board:Array(9).fill(''),
      turn:'X',
      winner:'',
      scores:{X:0,O:0,draws:0,matches:0},
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });
    await enterRoom(id);
  }catch(e){message('menuStatus','Não foi possível criar: '+e.message);}
}

async function joinRoom(){
  try{
    await waitAuth();
    const id=$('roomInput').value.trim().toUpperCase();
    if(!id) return message('menuStatus','Digite o código da sala.');
    const ref=db.ref('ticTacToe/'+id);
    const snap=await ref.get();
    if(!snap.exists()) return message('menuStatus','Sala não encontrada.');
    const data=snap.val();
    if(data.players?.X?.uid===uid || data.players?.O?.uid===uid){
      return enterRoom(id);
    }
    if(data.status!=='lobby' || data.players?.O){
      return message('menuStatus','Essa sala já está cheia ou em andamento.');
    }
    await ref.child('players/O').set({uid,name:cleanName()});
    await enterRoom(id);
  }catch(e){message('menuStatus','Erro ao entrar: '+e.message);}
}

async function enterRoom(id){
  roomId=id;
  roomRef=db.ref('ticTacToe/'+id);
  const snap=await roomRef.get();
  if(!snap.exists()) throw new Error('Sala não encontrada.');
  const data=snap.val();
  mySymbol=data.players?.X?.uid===uid?'X':
    data.players?.O?.uid===uid?'O':null;
  if(!mySymbol) throw new Error('Você não pertence a esta sala.');
  $('roomCode').textContent=id;
  show(data.status==='lobby'?lobby:game);
  if(unsubscribe) unsubscribe();
  const listener=roomRef.on('value',s=>{
    if(!s.exists()){
      message('gameStatus','A sala foi encerrada.');
      return;
    }
    roomData=s.val();
    mySymbol=roomData.players?.X?.uid===uid?'X':
      roomData.players?.O?.uid===uid?'O':mySymbol;
    render();
  });
  unsubscribe=()=>roomRef.off('value',listener);
}

function render(){
  if(!roomData)return;
  const d=roomData;
  if(d.status==='lobby'){
    show(lobby);
    const x=d.players?.X, o=d.players?.O;
    $('lobbyPlayers').innerHTML=`
      <div class="player"><div class="symbol" style="color:#54a0ff">X</div>
      <strong>${escapeHtml(x?.name||'Aguardando')}</strong><br><small>Jogador 1</small></div>
      <div class="player"><div class="symbol" style="color:#20d99a">O</div>
      <strong>${escapeHtml(o?.name||'Aguardando')}</strong><br><small>Jogador 2</small></div>`;
    message('lobbyStatus',o?'Os dois jogadores estão prontos!':'Compartilhe o código com seu amigo.');
    $('startBtn').classList.toggle('hidden',!(d.host===uid && x && o));
    return;
  }
  show(game);
  const x=d.players?.X, o=d.players?.O;
  $('nameX').textContent=x?.name||'Jogador X';
  $('nameO').textContent=o?.name||'Jogador O';
  $('scoreX').textContent=(d.scores?.X||0)+' vitórias';
  $('scoreO').textContent=(d.scores?.O||0)+' vitórias';
  $('draws').textContent=d.scores?.draws||0;
  $('matches').textContent=d.scores?.matches||0;
  $('playerX').classList.toggle('active',d.turn==='X'&&!d.winner);
  $('playerO').classList.toggle('active',d.turn==='O'&&!d.winner);

  const board=d.board||Array(9).fill('');
  const winning=d.winningLine||[];
  $('board').innerHTML='';
  board.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='cell'+(v?' '+v.toLowerCase():'')+(winning.includes(i)?' winner':'');
    b.textContent=v;
    b.disabled=!!v||!!d.winner||d.turn!==mySymbol||!o;
    b.addEventListener('click',()=>play(i));
    $('board').appendChild(b);
  });
  if(d.winner==='draw') message('gameStatus','Deu velha! Empate.');
  else if(d.winner) message('gameStatus',(d.winner===mySymbol?'Você venceu!':'Você perdeu!')+' 🎉');
  else message('gameStatus',d.turn===mySymbol?'Sua vez de jogar!':'Vez de '+(d.players?.[d.turn]?.name||'outro jogador')+'.');
  $('rematchBtn').classList.toggle('hidden',!d.winner);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function findWinner(b){
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const line of lines){
    const [a,c,d]=line;
    if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {winner:b[a],line};
  }
  return b.every(Boolean)?{winner:'draw',line:[]}:null;
}

async function play(index){
  if(busy||!roomData||roomData.winner||roomData.turn!==mySymbol)return;
  busy=true;
  try{
    await roomRef.transaction(d=>{
      if(!d||d.status!=='play'||d.winner||d.turn!==mySymbol||d.board[index])return;
      const board=[...d.board];
      board[index]=mySymbol;
      const result=findWinner(board);
      d.board=board;
      if(result){
        d.winner=result.winner;
        d.winningLine=result.line;
        d.scores=d.scores||{X:0,O:0,draws:0,matches:0};
        d.scores.matches=(d.scores.matches||0)+1;
        if(result.winner==='draw')d.scores.draws=(d.scores.draws||0)+1;
        else d.scores[result.winner]=(d.scores[result.winner]||0)+1;
      }else d.turn=mySymbol==='X'?'O':'X';
      return d;
    });
  }catch(e){message('gameStatus','Erro na jogada: '+e.message);}
  finally{busy=false;}
}

async function startGame(){
  if(!roomData||roomData.host!==uid||!roomData.players?.O)return;
  await roomRef.update({
    status:'play',board:Array(9).fill(''),turn:'X',
    winner:'',winningLine:[]
  });
}

async function rematch(){
  if(!roomData?.winner||busy)return;
  busy=true;
  try{
    await roomRef.transaction(d=>{
      if(!d||!d.winner)return;
      d.board=Array(9).fill('');
      d.turn='X';d.winner='';d.winningLine=[];
      d.status='play';
      return d;
    });
  }finally{busy=false;}
}

async function leave(){
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  roomId=null;roomRef=null;roomData=null;mySymbol=null;
  show(menu);
}

$('createBtn').onclick=createRoom;
$('joinBtn').onclick=joinRoom;
$('startBtn').onclick=startGame;
$('rematchBtn').onclick=rematch;
$('backBtn').onclick=leave;
$('leaveLobby').onclick=leave;
$('copyBtn').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(roomId);
    $('copyBtn').textContent='Código copiado!';
    setTimeout(()=>$('copyBtn').textContent='Copiar código',1800);
  }catch(e){message('lobbyStatus','Código: '+roomId);}
};
$('roomInput').addEventListener('input',e=>{
  e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
});
</script>
</body>
</html>
